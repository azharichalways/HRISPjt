<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Presensi & Agenda HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <div id="app" class="max-w-md mx-auto w-full bg-white min-h-screen flex flex-col shadow-lg relative pb-20">
        
        <!-- Screen: Auth / Login -->
        <div id="authScreen" class="flex-1 flex flex-col justify-center px-6 py-12">
            <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white text-2xl font-bold shadow-lg">
                    HR
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Portal Karyawan</h2>
                <p class="mt-2 text-sm text-gray-600">Masukkan kode akses untuk masuk</p>
            </div>

            <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
                    <div>
                        <label for="loginKode" class="block text-sm font-medium text-gray-700">Kode Akses / PIN</label>
                        <div class="mt-1">
                            <input id="loginKode" name="kode" type="password" required class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-center text-lg tracking-widest">
                        </div>
                    </div>

                    <div>
                        <button type="submit" id="loginBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all">
                            Masuk
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Screen: Main App -->
        <div id="mainScreen" class="hidden flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 id="userName" class="font-bold text-lg leading-tight">Nama Karyawan</h1>
                        <p id="userRole" class="text-xs text-blue-100">Jabatan / Divisi</p>
                    </div>
                    <button onclick="handleLogout()" class="text-blue-100 hover:text-white p-2 rounded-lg text-sm flex items-center gap-1">
                        <i class="fas fa-sign-out-alt"></i> Keluar
                    </button>
                </div>
            </header>

            <!-- Main Content Area -->
            <main id="content" class="flex-1 p-4 space-y-4">
                <!-- Content injected dynamically via JS -->
            </main>

            <!-- Bottom Navigation -->
            <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around p-2 z-20">
                <!-- Navigation items injected via JS -->
            </nav>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-lg text-sm shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
            Pesan Toast
        </div>

    </div>

    <script>
        // Data State Application
        let currentUser = null;
        let currentTab = 'home';

        // Inisialisasi Aplikasi
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function checkAuth() {
            const savedUser = localStorage.getItem('app_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMainScreen();
            } else {
                showAuthScreen();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const kode = document.getElementById('loginKode').value;

            if (!kode) {
                showToast('Masukkan kode akses!');
                return;
            }

            // Simulasi Otentikasi
            currentUser = {
                id: 'EMP-001',
                nama: 'Ahmad Sofyan',
                role: 'HR Officer',
                isHR: true
            };

            localStorage.setItem('app_user', JSON.stringify(currentUser));
            showMainScreen();
            showToast('Berhasil masuk');
        }

        function handleLogout() {
            localStorage.removeItem('app_user');
            currentUser = null;
            showAuthScreen();
            showToast('Berhasil keluar');
        }

        function showAuthScreen() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('loginKode').value = '';
        }

        function showMainScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');

            document.getElementById('userName').innerText = currentUser.nama;
            document.getElementById('userRole').innerText = currentUser.role;

            renderBottomNav();
            switchTab('home');
        }

        function renderBottomNav() {
            const nav = document.getElementById('bottomNav');
            let navItems = [
                { id: 'home', label: 'Beranda', icon: 'fa-home' },
                { id: 'presensi', label: 'Presensi', icon: 'fa-camera' },
                { id: 'agenda', label: 'Agenda', icon: 'fa-calendar-alt' }
            ];

            if (currentUser && currentUser.isHR) {
                navItems.push({ id: 'hr', label: 'HR Dashboard', icon: 'fa-user-shield' });
            }

            nav.innerHTML = navItems.map(item => `
                <button onclick="switchTab('${item.id}')" class="flex flex-col items-center py-1 px-3 text-xs font-medium ${currentTab === item.id ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'}">
                    <i class="fas ${item.icon} text-lg mb-1"></i>
                    ${item.label}
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            renderBottomNav();
            const content = document.getElementById('content');

            switch (tabId) {
                case 'home':
                    renderHomeTab(content);
                    break;
                case 'presensi':
                    renderPresensiTab(content);
                    break;
                case 'agenda':
                    renderAgendaTab(content);
                    break;
                case 'hr':
                    renderHRDashboard(content);
                    break;
                default:
                    renderHomeTab(content);
            }
        }

        function renderHomeTab(container) {
            container.innerHTML = `
                <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                    <h3 class="font-semibold text-blue-900">Selamat Datang, ${currentUser.nama}</h3>
                    <p class="text-xs text-blue-700 mt-1">Gunakan navigasi di bawah untuk mengakses fitur presensi dan agenda kerja.</p>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div class="bg-white p-4 rounded-xl border border-gray-200 text-center shadow-sm">
                        <span class="text-xs text-gray-500">Status Masuk</span>
                        <p class="text-lg font-bold text-green-600 mt-1">08:00 WIB</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-gray-200 text-center shadow-sm">
                        <span class="text-xs text-gray-500">Status Pulang</span>
                        <p class="text-lg font-bold text-gray-400 mt-1">--:--</p>
                    </div>
                </div>
            `;
        }

        function renderPresensiTab(container) {
            container.innerHTML = `
                <div class="bg-white rounded-xl border border-gray-200 p-4 text-center space-y-4">
                    <h3 class="font-bold text-gray-800">Kamera Presensi</h3>
                    <div class="w-full h-48 bg-gray-900 rounded-xl flex items-center justify-center text-gray-400">
                        <i class="fas fa-camera text-4xl"></i>
                    </div>
                    <button onclick="capturePhotoAndAbsen()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition-all">
                        Ambil Foto & Absen
                    </button>
                </div>
            `;
        }

        function capturePhotoAndAbsen() {
            showToast('Presensi berhasil dicatat!');
        }

        function renderAgendaTab(container) {
            container.innerHTML = `
                <div class="space-y-3">
                    <h3 class="font-bold text-gray-800">Agenda Hari Ini</h3>
                    <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex items-start gap-3">
                        <div class="bg-blue-100 text-blue-600 p-2 rounded-lg mt-1">
                            <i class="fas fa-users"></i>
                        </div>
                        <div>
                            <h4 class="font-semibold text-sm">Meeting Mingguan HR</h4>
                            <p class="text-xs text-gray-500">10:00 - 11:30 WIB | Ruang Rapat A</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHRDashboard(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <h3 class="font-bold text-gray-800">Dashboard Manajemen HR</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl">
                            <p class="text-xs text-emerald-600">Hadir Hari Ini</p>
                            <p class="text-xl font-bold text-emerald-800">24 Karyawan</p>
                        </div>
                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl">
                            <p class="text-xs text-amber-600">Izin / Sakit</p>
                            <p class="text-xl font-bold text-amber-800">2 Karyawan</p>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
