<script id="v1029Patch">
/* ================= V10.2.9 ================= */

/* ---------- 1) Pembanding NIK toleran (nol di depan / angka vs teks) ---------- */
function v109Strip(s){return String(s==null?'':s).trim().replace(/^0+/,'')||'0';}
sameId_=function(a,b){const x=idText_(a),y=idText_(b);return x!==''&&y!==''&&(x===y||v109Strip(x)===v109Strip(y));};
function v109Id(a,b){return String(a)===String(b);}

/* ---------- 2) ID numerik dari server dikembalikan jadi Number (onclick memakai literal angka) ---------- */
const v109MapBase=mapBootstrapToCaches;
mapBootstrapToCaches=function(bs){
  v109MapBase(bs);
  const num=v=>/^\d{1,15}$/.test(String(v))?Number(v):v;
  ['halbaik_all','ideas_all','agendas_all','private_messages_all','leader_notes_all','monthly_reports_all'].forEach(key=>{
    try{const arr=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(arr)){arr.forEach(x=>{if(x&&x.id!==undefined)x.id=num(x.id);});localStorage.setItem(key,JSON.stringify(arr));}}catch(_){}
  });
  if(Array.isArray(bs.leaves)){
    const mapped=bs.leaves.map(l=>{
      const owner=(state.allUsers||[]).find(u=>sameId_(u.nik,l.nik))||{};
      return {id:num(l.id),start:l.start_date,end:l.end_date,startDate:l.start_date,endDate:l.end_date,ket:l.reason,status:l.status,
        nik:idText_(l.nik),nama:l.nama,brand:owner.brand||'',leaderNik:idText_(l.leader_nik),
        leaderNote:l.leader_note||'',createdAt:l.created_at||'',reviewedAt:l.reviewed_at||'',reviewedBy:idText_(l.reviewed_by)};
    });
    localStorage.setItem('leaves_all',JSON.stringify(mapped));
  }
};

/* ---------- 3) Format tanggal ---------- */
const V109_MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function v109D(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${+m[3]} ${V109_MON[+m[2]-1]} ${m[1]}`:(s||'-');}
function v109DT(s){if(!s)return '-';const d=new Date(s);if(isNaN(d))return v109D(s);const p=n=>String(n).padStart(2,'0');return `${d.getDate()} ${V109_MON[d.getMonth()]} ${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function v109Days(a,b){const x=new Date(a+'T00:00:00'),y=new Date((b||a)+'T00:00:00');return (isNaN(x)||isNaN(y))?'':Math.floor((y-x)/864e5)+1;}

/* ---------- 4) Aksi review: SERVER DULU, baru tampil berubah (tidak ada item "muncul lagi") ---------- */
function v109Patch(list,key,id,patch){
  const arr=state[list]||[];const it=arr.find(x=>v109Id(x.id,id));if(it)Object.assign(it,patch);
  try{localStorage.setItem(key,JSON.stringify(arr));}catch(_){}
}
async function v109Call(action,payload,fallback){
  const res=await gasCall(action,payload);           // pesan error sudah ditampilkan oleh gasCall
  if(!res||!res.ok)return false;
  let synced=false;try{synced=await syncFromServer();}catch(_){}
  if(!synced&&fallback)fallback();
  return true;
}

async function v109ReviewLeave(id,status,from){
  const ok=await v109Call('reviewLeave',{id:String(id),status,note:''},()=>v109Patch('leaves','leaves_all',id,{status,reviewedAt:new Date().toISOString()}));
  if(!ok)return;
  showToast(status==='Approved'?'✅ Libur disetujui.':'❌ Libur ditolak.');
  if(from==='hr')renderHRLeaderLeaves();else showLeaderSection('leaves');
}
approveLeave=function(id,isApprove){return v109ReviewLeave(id,isApprove?'Approved':'Rejected','leader');};
v102ReviewLeaderLeave=function(id,status){return v109ReviewLeave(id,status,'hr');};

approveHalBaik=async function(id,isApprove){
  const note=(document.getElementById('note_'+id)?.value||'').trim(),status=isApprove?'Approved':'Rejected';
  const ok=await v109Call('reviewGoodDeed',{id:String(id),status,note},()=>v109Patch('halBaik','halbaik_all',id,{status,leaderNote:note||'-'}));
  if(!ok)return;
  showToast(isApprove?'✅ Kontribusi dikonfirmasi. +20 XP untuk anggota.':'Kontribusi tidak disetujui.');
  showLeaderSection('halbaik');
};
approveLeaderIdea=async function(id,isApprove){
  const note=(document.getElementById('ideNote_'+id)?.value||'').trim(),status=isApprove?'Forwarded':'Rejected';
  const ok=await v109Call('reviewIdeaLeader',{id:String(id),status,note},()=>v109Patch('ideas','ideas_all',id,{status,leaderNote:note||'-'}));
  if(!ok)return;
  showToast(isApprove?'💡 Ide diteruskan ke HR.':'Ide tidak disetujui Leader.');
  showLeaderSection('ideas');
};
decideIdeaByHR=async function(id,status){
  const note=(document.getElementById('hrNote_'+id)?.value||'').trim();
  const ok=await v109Call('reviewIdeaHR',{id:String(id),status,note},()=>v109Patch('ideas','ideas_all',id,{status,hrNote:note||'-'}));
  if(!ok)return;
  showToast(status==='HRAccepted'?'✅ Ide diterima HR.':status==='HRRejected'?'❌ Ide ditolak HR.':'📝 Ide ditandai untuk kajian lanjutan.');
  renderIdeHalBaikHRTab();
};
markIdeaImplemented=async function(id){
  const ok=await v109Call('implementIdea',{id:String(id)},()=>v109Patch('ideas','ideas_all',id,{status:'Implemented'}));
  if(!ok)return;
  showToast('🚀 Ide ditandai sudah diimplementasikan.');
  renderIdeHalBaikHRTab();
};

/* ---------- 5) Halaman Libur: Leader (tim) & HR (Leader) — Menunggu + Riwayat + tanggal pengajuan ---------- */
function v109LeaveCard(l,mode,from){
  const st=statusText_(l.status);
  const pill=st==='approved'?'<span class="status-pill approved">✓ Disetujui</span>':st==='rejected'?'<span class="status-pill rejected">✕ Ditolak</span>':'<span class="status-pill pending">🟡 Menunggu</span>';
  const s=l.start||l.startDate,e=l.end||l.endDate||s,n=v109Days(s,e);
  const brand=l.brand?` (${v101Esc(l.brand)})`:'';
  const by=l.reviewedBy?((state.allUsers||[]).find(u=>sameId_(u.nik,l.reviewedBy))||{}).nama:'';
  return `<div class="v102-leave">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><strong style="font-size:12px">${v101Esc(l.nama||l.nik)}${brand}</strong>${pill}</div>
    <div class="v109-leave-meta">📅 <strong>${v109D(s)}</strong> s/d <strong>${v109D(e)}</strong>${n?` • ${n} hari`:''}<br>🕒 Diajukan: ${v109DT(l.createdAt)}${l.ket?`<br>📝 ${v101Esc(l.ket)}`:''}${l.reviewedAt?`<br>✔️ Diputuskan: ${v109DT(l.reviewedAt)}${by?` oleh ${v101Esc(by)}`:''}`:''}</div>
    ${l.leaderNote&&l.leaderNote!=='-'?`<div class="v109-leave-note">Catatan: ${v101Esc(l.leaderNote)}</div>`:''}
    ${mode==='pending'?`<div style="display:flex;gap:7px;margin-top:8px"><button class="btn success" style="padding:8px;font-size:11px" onclick="v109ReviewLeave('${v101Esc(l.id)}','Approved','${from}')">Setujui</button><button class="btn danger" style="padding:8px;font-size:11px" onclick="v109ReviewLeave('${v101Esc(l.id)}','Rejected','${from}')">Tolak</button></div>`:''}
  </div>`;
}
function v109Tabs(tab,fn,p,h){
  return `<div class="subnav-tabs"><button class="subnav-btn ${tab==='pending'?'active':''}" onclick="${fn}('pending')">Menunggu (${p})</button><button class="subnav-btn ${tab==='history'?'active':''}" onclick="${fn}('history')">Riwayat (${h})</button></div>`;
}
const v109ByReviewed=(a,b)=>String(b.reviewedAt||b.createdAt||'').localeCompare(String(a.reviewedAt||a.createdAt||''));

state.leaderLeaveTab='pending';
function v109LeaderLeaveTab(t){state.leaderLeaveTab=t;renderLeaderLeavesInto('leaderSectionList');}
renderLeaderLeavesInto=function(id){
  const list=document.getElementById(id);if(!list)return;
  const me=state.activeProfile.nik;
  const mine=(state.leaves||[]).filter(l=>!sameId_(l.nik,me)&&(sameId_(l.leaderNik,me)||(state.allUsers||[]).some(u=>sameId_(u.nik,l.nik)&&sameId_(u.leaderNik,me))));
  const pending=mine.filter(l=>isPending_(l.status)).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  const hist=mine.filter(l=>!isPending_(l.status)&&statusText_(l.status)!=='pendinghr').sort(v109ByReviewed);
  const tab=state.leaderLeaveTab||'pending';
  list.innerHTML=v109Tabs(tab,'v109LeaderLeaveTab',pending.length,hist.length)+
    (tab==='pending'?(pending.length?pending.map(l=>v109LeaveCard(l,'pending','leader')).join(''):'<div class="empty">Tidak ada pengajuan libur yang menunggu review.</div>')
                    :(hist.length?hist.map(l=>v109LeaveCard(l,'history','leader')).join(''):'<div class="empty">Belum ada riwayat pengajuan libur tim.</div>'));
};

state.hrLeaveTab='pending';
function v109HrLeaveTab(t){state.hrLeaveTab=t;renderHRLeaderLeaves();}
function v102LeaderLeaves(){return (state.leaves||[]).filter(l=>statusText_(l.status)==='pendinghr');}
renderHRLeaderLeaves=function(){
  const c=document.getElementById('content');
  const leaderNiks=(state.allUsers||[]).filter(u=>u.role==='leader').map(u=>u.nik);
  const mine=(state.leaves||[]).filter(l=>leaderNiks.some(n=>sameId_(n,l.nik)));
  const pending=mine.filter(l=>statusText_(l.status)==='pendinghr').sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  const hist=mine.filter(l=>statusText_(l.status)!=='pendinghr').sort(v109ByReviewed);
  const tab=state.hrLeaveTab||'pending';
  c.innerHTML=`<div class="v4-section-head"><strong>🏖️ Pengajuan Libur Leader</strong><button class="v102-back" onclick="appBack()">← Kembali</button></div>`+
    v109Tabs(tab,'v109HrLeaveTab',pending.length,hist.length)+
    (tab==='pending'?(pending.length?pending.map(l=>v109LeaveCard(l,'pending','hr')).join(''):'<div class="empty">Tidak ada pengajuan Leader yang menunggu HR.</div>')
                    :(hist.length?hist.map(l=>v109LeaveCard(l,'history','hr')).join(''):'<div class="empty">Belum ada riwayat pengajuan libur Leader.</div>'));
};
// Menu "Pengajuan Leader" selalu tersedia di dashboard HR (sebelumnya hanya muncul bila ada yang menunggu).
const v109HRDash=renderHRDashboard;
renderHRDashboard=function(){
  v109HRDash();
  const grid=document.querySelector('#content .home-grid');if(!grid)return;
  if([...grid.children].some(b=>(b.textContent||'').includes('Pengajuan Leader')))return;
  const n=v102LeaderLeaves().length;
  const b=document.createElement('button');b.className='home-tile';
  b.onclick=()=>{v102RememberView();renderHRLeaderLeaves();};
  b.innerHTML=`<div class="icon">🏖️</div><div class="title">Pengajuan Leader</div><div class="desc">Konfirmasi & riwayat libur Leader.</div>${n?`<span class="notify">${n}</span>`:''}`;
  grid.insertBefore(b,grid.children[2]||null);
};

/* ---------- 6) Kelola akun: sinkron ulang dari server setelah simpan (relasi Leader selalu terbaru) ---------- */
['hrAddEmployee','hrSaveEditedUser','hrDeleteUser'].forEach(fn=>{
  const base=window[fn];if(typeof base!=='function')return;
  window[fn]=async function(...a){
    const r=await base.apply(this,a);
    try{await syncFromServer();}catch(_){}
    if(fn==='hrSaveEditedUser'&&document.getElementById('hrSubTabContent'))renderHRSubTabContent();
    return r;
  };
});

/* ---------- 7) Kamera: potret 3:4, tidak mirror (preview & hasil), foto ringan ---------- */
startCamera=async function(){
  stopCamera();const video=document.getElementById('camVideo');if(!video)return;
  const facing=state.cameraFacing||'user';
  const tryGet=c=>navigator.mediaDevices.getUserMedia({video:c,audio:false});
  try{
    let stream;
    try{stream=await tryGet({facingMode:{ideal:facing},width:{ideal:720},height:{ideal:960},aspectRatio:{ideal:0.75}});}
    catch(_){stream=await tryGet({facingMode:{ideal:facing}});}
    state.stream=stream;video.srcObject=stream;video.style.setProperty('transform','none','important');
    try{await video.play();}catch(_){}
    v102CameraTools();
  }catch(err){console.warn(err);showToast('⚠️ Kamera tidak dapat diakses. Periksa izin kamera browser.');}
};
capturePhotoDataUrl_=function(){
  const video=document.getElementById('camVideo'),canvas=document.getElementById('camCanvas');
  if(!video||!canvas||!video.videoWidth)return null;
  const vw=video.videoWidth,vh=video.videoHeight,target=3/4;
  let sw=vw,sh=vh;if(vw/vh>target)sw=Math.round(vh*target);else sh=Math.round(vw/target);
  const sx=Math.round((vw-sw)/2),sy=Math.round((vh-sh)/2);
  canvas.width=480;canvas.height=640;                                  // potret 3:4, ±50–80 KB
  const ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(video,sx,sy,sw,sh,0,0,480,640);                        // tanpa flip → hasil tidak mirror
  try{return canvas.toDataURL('image/jpeg',0.7);}catch(_){return null;}
};

/* ---------- 8) KPI sisi aplikasi diselaraskan dengan server ---------- */
// Alpha / tidak absen pulang dicatat server sebagai baris Attendance (type 'system'); alpha lokal dimatikan agar tidak ganda.
v6ReconcileAllUsers=function(){};
v6ReconcileAbsenceForUser=function(){};
function v109AttStats(nik){
  let recs=[];try{recs=JSON.parse(localStorage.getItem('records_'+nik)||'[]');}catch(_){}
  const cut=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  let sum=0,days=0,pen=0,alpha=0,missout=0,late=0,real=0;
  recs.filter(r=>String(r.date||'').slice(0,10)>=cut).forEach(r=>{
    const s=String(r.statusText||''),t=r.type;
    if(t==='masuk'){days++;real++;sum+=s==='Terlambat Masuk'?50:(s==='Terlambat Briefing'||s==='Hadir Briefing')?85:100;if(s==='Terlambat Masuk')late++;}
    else if(s==='Alpha'){days++;alpha++;}
    else if(s==='Tidak Absen Pulang'){pen+=4;missout++;}
    else if(t==='pulang'){real++;if(s==='Pulang Awal'){pen+=2;late++;}}
  });
  return {score:days?Math.max(0,Math.min(100,Math.round(sum/days-pen))):100,alpha,missout,late,total:real};
}
v6AttendanceScore=function(nik){return v109AttStats(nik).score;};
v6PenaltyStats=function(nik){const s=v109AttStats(nik);return {alpha:s.alpha,missingCheckout:s.missout,xpLost:s.alpha*20+s.missout*5,rows:[]};};
getUserPerformance=function(nik){
  const s=v109AttStats(nik);
  const good=state.halBaik.filter(h=>sameId_(h.nik,nik)&&h.status==='Approved').length;
  const ideas=state.ideas.filter(i=>sameId_(i.nik,nik)&&['Forwarded','HRReview','HRAccepted','Implemented'].includes(i.status)).length;
  let acts=0;try{acts=JSON.parse(localStorage.getItem('activities_'+nik)||'[]').length;}catch(_){}
  return {total:s.total,late:s.late,discipline:s.score,good,ideas,activities:acts};
};
// Inisiatif tim = proporsi kehadiran pada agenda tim Leader-nya bulan ini (tidak ada agenda = 100).
v7TeamInitiativeStats=function(nik){
  const month=v6LocalIso().slice(0,7),today=v6LocalIso();
  let st={};try{st=JSON.parse(localStorage.getItem('agenda_user_status_all')||'{}');}catch(_){}
  const u=(state.allUsers||[]).find(x=>sameId_(x.nik,nik))||{};
  const el=(state.agendas||[]).filter(a=>a.scope==='team'&&sameId_(a.teamLeaderNik,u.leaderNik)&&String(a.date||'').startsWith(month)&&String(a.date||'')<=today);
  const att=el.filter(a=>st[a.id+'_'+nik]?.status==='mengikuti').length;
  return {score:el.length?Math.round(att/el.length*100):100,attended:att,counted:att,max:el.length};
};
v6MonthlyReportScore=function(leaderNik){
  v4EnsureStores();const m=v6LocalIso().slice(0,7);
  return state.monthlyReports.some(r=>sameId_(r.leaderNik,leaderNik)&&r.month===m&&String(r.summary||'').trim().length>=50)?100:0;
};
const v109SubmitReport=submitMonthlyReport;
submitMonthlyReport=function(){
  const s=(document.getElementById('monthlySummary')?.value||'').trim();
  if(s.length<50){showToast('⚠️ Ringkasan minimal 50 karakter ('+s.length+'/50).');return;}
  v109SubmitReport();
};
</script>
